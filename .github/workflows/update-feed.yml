name: Update Physical AI Feed

on:
  schedule:
    # 3시간마다 실행 (UTC 기준). arXiv는 하루 1회 갱신, 뉴스는 더 자주 갱신됨.
    - cron: "20 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch feed
        run: python scripts/fetch_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json
          if git diff --staged --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: update physical ai feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
